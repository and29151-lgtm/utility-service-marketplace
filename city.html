<!DOCTYPE html>

<head>

</head>
<body>

<header>

    <p>Choose your location to continue</p>
</header>

<section class="services">

        <button onclick="selectCity('Calicut')">Select</button>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
